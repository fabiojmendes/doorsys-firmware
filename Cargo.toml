[package]
authors = ["Fabio Mendes <fabiojmendes@gmail.com>"]
edition = "2024"
name = "doorsys-firmware"
rust-version = "1.95"
version = "0.4.4"

[[bin]]
name = "doorsys-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

defmt = "1.0.1"
esp-metadata-generated = "0.5"
esp-bootloader-esp-idf = { version = "0.6.0", default-features = false, features = [
  "defmt",
  "esp-storage",
  "esp32c3",
] }
esp-storage = { version = "0.10.0", features = [
  "defmt",
  "embedded-storage",
  "esp32c3",
] }

embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4-hostname",
  "dns",
  "tcp",
  "udp",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }

embedded-io-async = { version = "0.7.0", features = ["defmt"] }

esp-alloc = { version = "0.11.0", features = [
  "defmt",
  "esp32c3",
  "internal-heap-stats",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp32c3",
  "wifi",
] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }

critical-section = "1.2.0"
static_cell = "2.1.1"

# Application & protocol dependencies
doorsys-protocol = { git = "https://github.com/fabiojmendes/doorsys-protocol.git", tag = "v0.3.0", default-features = false }
embedded-cli = "0.2.1"
heapless = { version = "0.9.1", features = ["defmt", "serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-defmt"] }
rust-mqtt = { version = "0.6.0", default-features = false, features = [
  "bump",
  "defmt",
  "v5",
] }
sequential-storage = { version = "8.0.2", default-features = false, features = [
  "defmt",
] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
] }
sntpc = { version = "0.11.0", default-features = false, features = ["defmt"] }
sntpc-net-embassy = { version = "0.11.0", default-features = false, features = [
  "defmt",
] }

[build-dependencies]
built = { version = "0.8", features = ["git2"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
